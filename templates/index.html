<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>🤖 AI Agent</h2>

        <ul>
            <li class="active">Dashboard</li>
        </ul>

        <!-- Voice Agent -->
        <div class="agent-box text-center mt-5">
            <div class="agent-avatar" id="voiceBtn">
                🎙️
            </div>

            <p class="mt-3 text-light">
                Click mic and ask question
            </p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Top -->
        <div class="topbar">
            <h1>Enterprise AI Assistant</h1>
            <p>Ask questions in natural language and get business insights instantly.</p>
        </div>

        <!-- Main Card -->
        <div class="main-card">

            <h3 class="mb-3">Ask Your Business Data</h3>

            <!-- Sample Questions -->
            <div class="sample-buttons mb-4">
                <button class="sample-question">Show today's sales</button>
                <button class="sample-question">Top customers</button>
                <button class="sample-question">Top products</button>
                <button class="sample-question">Total sales</button>
            </div>

            <!-- Search -->
            <div class="search-wrapper">
                <input
                    id="question"
                    type="text"
                    class="search-input"
                    autocomplete="off"
                    placeholder="Ask anything about your sales database..."
                >

                <button id="askBtn" class="ask-btn">
                    Ask AI
                </button>
            </div>

            <!-- Language -->
            <div class="mb-3">
                <label for="languageSelect" class="form-label fw-bold">
                    AI Voice Language
                </label>

                <select id="languageSelect" class="form-select">
                    <option value="en-US">English</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="ta-IN">Tamil</option>
                </select>
            </div>

            <!-- Loading -->
            <div class="text-center my-4 d-none" id="loading">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Analyzing your data...</p>
            </div>

            <!-- Answer -->
            <div class="dashboard-section">
                <h3>🧠 AI Answer</h3>
                <div id="answer" class="answer-box">
                    Waiting for your question...
                </div>
            </div>

            <!-- SQL -->
            <div class="dashboard-section">
                <h3>💻 SQL Generated</h3>
                <pre id="sqlBox">Waiting...</pre>
            </div>

            <!-- Table -->
    

        </div>

    </main>
</div>

<script src="/static/app.js?v=7"></script>
</body>
</html>
