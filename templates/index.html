<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enterprise AI Assistant</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">

<div class="container">

<span class="navbar-brand mb-0 h1">

🤖 Enterprise AI Assistant

</span>

</div>

</nav>

<div class="container mt-5">

<div class="row">

<div class="col-lg-10 mx-auto">

<div class="card shadow-lg">

<div class="card-body">

<h3 class="mb-3">

Ask Your Business Data

</h3>

<p class="text-muted">

Examples:

</p>

<div class="mb-3">

<button class="btn btn-outline-primary btn-sm me-2 sample-question">

Show today's sales

</button>

<button class="btn btn-outline-success btn-sm me-2 sample-question">

Top customers

</button>

<button class="btn btn-outline-warning btn-sm me-2 sample-question">

Top products

</button>

<button class="btn btn-outline-danger btn-sm sample-question">

Total sales

</button>

</div>

<div class="input-group mb-3">

<input

id="question"

type="text"

class="form-control"

placeholder="Ask anything about your sales database...">

<button

class="btn btn-primary"

id="askBtn">

Ask AI

</button>

</div>

<div class="text-center my-3 d-none" id="loading">

<div class="spinner-border text-primary">

</div>

<p class="mt-2">

Thinking...

</p>

</div>

<hr>

<h4>

AI Answer

</h4>

<div id="answer" class="answer-box">

Waiting for your question...

</div>

<hr>

<h4>

SQL Generated

</h4>

<pre id="sqlBox"></pre>

<hr>

<h4>

Returned Data

</h4>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr id="tableHead">

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="/static/app.js"></script>

</body>

</html>
